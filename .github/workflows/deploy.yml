name: CI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.9.6

      - name: Check Edge Function types
        run: >-
          deno check
          supabase/functions/musrenai-chat/index.ts
          supabase/functions/admin-ai-triage/index.ts
          supabase/functions/musrenai-cost-hint/index.ts

      - name: Test Deno HTTP handler on loopback
        run: deno test --allow-net=127.0.0.1 supabase/tests/musrenai_deno_runtime.ts

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run checks
        run: bun test && bun run typecheck
