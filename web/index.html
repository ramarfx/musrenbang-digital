<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Musrenbang Digital: usulkan program, alokasikan anggaran virtual, beri suara, dan bandingkan prioritas warga dengan APBD."
    />
    <meta name="theme-color" content="#F7F4EF" />
    <script>
      // Pasang tema sebelum halaman tergambar supaya tidak berkedip. Bawaannya terang, tidak
      // mengikuti tema sistem; mode gelap hanya dipakai kalau warga memilihnya sendiri.
      (function () {
        var tema = null;
        try {
          tema = localStorage.getItem('mb-tema');
        } catch (e) {}
        if (tema !== 'gelap') tema = 'terang';
        document.documentElement.dataset.theme = tema === 'gelap' ? 'dark' : 'light';
        if (tema === 'gelap') {
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0F1A21');
        }
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <title>Musrenbang Digital</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
